services:
  - type: web
    name: routesetu-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: routesetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://routesetu-frontend.onrender.com

  - type: web
    name: routesetu-frontend
    runtime: static
    rootDir: routesetu-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://routesetu-api.onrender.com

databases:
  - name: routesetu-db
    databaseName: routesetudb
    user: routesetudb_user